{% extends "base.html" %}

{% block title %}Nutrición - KindiCore AI{% endblock %}

{% block content %}
<h1 style="margin-bottom: 2rem;">🍽️ Registro de Nutrición</h1>

<div class="card">
    <div class="card-header">Registrar Consumo de Alimentos</div>

    <form id="nutritionForm">
        <div class="form-group">
            <label class="form-label">Niño/a:</label>
            <select id="childSelect" class="form-select" required>
                <option value="">Seleccionar...</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Tipo de Comida:</label>
            <select id="mealType" class="form-select" required>
                <option value="desayuno">Desayuno</option>
                <option value="refrigerio_am">Refrigerio AM</option>
                <option value="almuerzo">Almuerzo</option>
                <option value="refrigerio_pm">Refrigerio PM</option>
                <option value="lactancia">Lactancia</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Nivel de Consumo:</label>
            <select id="consumptionLevel" class="form-select" required>
                <option value="todo">Todo (100%)</option>
                <option value="la_mayoria">La Mayoría (75%)</option>
                <option value="la_mitad">La Mitad (50%)</option>
                <option value="poco">Poco (25%)</option>
                <option value="nada">Nada (0%)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Observaciones:</label>
            <textarea id="notes" class="form-textarea" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Registrar</button>
    </form>
</div>

<script>
    async function loadChildren() {
        try {
            const data = await KindiCore.ChildrenAPI.getAll({ status: 'activo' });
            const select = document.getElementById('childSelect');

            data.children.forEach(child => {
                const option = document.createElement('option');
                option.value = child.id;
                option.textContent = child.full_name;
                select.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading children:', error);
        }
    }

    document.getElementById('nutritionForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            child_id: parseInt(document.getElementById('childSelect').value),
            meal_type: document.getElementById('mealType').value,
            consumption_level: document.getElementById('consumptionLevel').value,
            notes: document.getElementById('notes').value
        };

        try {
            await KindiCore.NutritionAPI.log(data);
            KindiCore.UI.showAlert('Nutrición registrada exitosamente', 'success');
            e.target.reset();
        } catch (error) {
            console.error('Error logging nutrition:', error);
            KindiCore.UI.showAlert('Error al registrar nutrición', 'error');
        }
    });

    document.addEventListener('DOMContentLoaded', loadChildren);
</script>
{% endblock %}
