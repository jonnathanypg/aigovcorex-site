ertical-align:top&amp;quot;&amp;gt;&amp;lt;b&amp;gt;¿Cómo se suprime en un lake inmutable?&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffffff;vertical-align:top&amp;quot;&amp;gt;Crypto-shredding: se destruye la DEK del titular; el time travel falla por diseño y el Erasure Registry se re-aplica tras restore o replay.&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffebee;vertical-align:top&amp;quot;&amp;gt;&amp;lt;b&amp;gt;¿Y si cae la plataforma?&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffebee;vertical-align:top&amp;quot;&amp;gt;El Core no depende de ella; reporting regulatorio manual desde réplica; DR activo-pasivo (RPO ≤ 5 min, RTO ≤ 1 h, supuestos).&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffffff;vertical-align:top&amp;quot;&amp;gt;&amp;lt;b&amp;gt;¿Mesh, Fabric, Lakehouse y CQRS se pisan?&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffffff;vertical-align:top&amp;quot;&amp;gt;No: Mesh = organización y contrato; Lakehouse = analítica; Fabric = acceso lógico; CQRS = lectura operacional (regla de uso en capa 5).&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffebee;vertical-align:top&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Tokens por dominio impiden joins&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffebee;vertical-align:top&amp;quot;&amp;gt;Solo vía Token Translation Service autorizado por OPA; el cruce es temporal, no se persiste y queda auditado.&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;quot;border:1px solid #cfd8dc;background:#ffffff;vertical-align:top&amp;quot;&amp;gt;&amp;lt;b&amp;gt;Dos ejes
