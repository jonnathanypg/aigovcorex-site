# ══════════════════════════════════════════════════════════════
# 🏛️ AI GovCoreX OS — Nginx Reverse Proxy Configuration (Production VPS)
# Dominio Principal: aigovcorex.com & www.aigovcorex.com
# Dashboard: app.aigovcorex.com & dashboard.aigovcorex.com
# API & SSE Streaming: /api/ -> :5000 (proxy_buffering off)
# WhatsApp Gateway: /whatsapp/ -> :3001
# ══════════════════════════════════════════════════════════════

# ── Redirección HTTP a HTTPS ──
server {
    listen 80;
    server_name aigovcorex.com www.aigovcorex.com app.aigovcorex.com dashboard.aigovcorex.com;
    return 301 https://$host$request_uri;
}

# ── 1. Portal Matriz Institucional (aigovcorex.com) ──
server {
    listen 443 ssl;
    server_name aigovcorex.com www.aigovcorex.com;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/aigovcorex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigovcorex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Next.js (Portal Matriz en :3002)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend Proxy & AI Streaming (SSE)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WhatsApp Microservice Gateway
    location /whatsapp/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 2. Dashboard Operativo de Programas Sociales & OS (app.aigovcorex.com) ──
server {
    listen 443 ssl;
    server_name app.aigovcorex.com dashboard.aigovcorex.com;
    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/aigovcorex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aigovcorex.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Dashboard Next.js (en :9002)
    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API Route & AI Streaming (SSE)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Widgets / Health
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
